    The canonical A2A card is served from the apex host and identically from www.theloopbreaker.com and
    from the API-prefixed alias https://theloopbreaker.com/api/.well-known/agent-card.json that llms.txt and
    agents.txt advertise (all three return the same 15,525-byte JSON object). The legacy
