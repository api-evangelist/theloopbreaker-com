apis:
- aid: theloopbreaker-com:vaultfire-agent-hub-api
  name: Vaultfire Agent Hub API
  description: >-
    Public REST API over the Vaultfire trust contracts on Base, Avalanche, Arbitrum and Polygon: agent trust
    profiles and Street Cred scores, ERC-8004 registration and partnership-bond transaction builders, agent
    discovery and task routing, webhooks, VNS name resolution, task escrow, VKP session keys, ZK/belief
    attestations, mission and privacy compliance reads, governance, insurance, disputes, bridge state and the
    full contract address book. Reads are public; routing writes require ERC-8128 signed requests; on-chain
    writes are returned unsigned for the caller's wallet.
  image: https://theloopbreaker.com/og-image.png
  humanURL: https://theloopbreaker.com/start
