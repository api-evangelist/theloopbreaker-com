- aid: theloopbreaker-com:vaultfire-trust-service-x402
  name: Vaultfire Trust Service (x402)
  description: >-
    The priced projection of the same trust surface: 77 endpoints under /api/x402/* (29 priced GET reads, 46
    priced POST transaction-preparation actions, 2 free) paid per call in USDC on Base mainnet with the x402
    v2 exact scheme. Each endpoint answers HTTP 402 with a PAYMENT-REQUIRED challenge until paid. Its only
    machine-readable contract is the x402 discovery manifest at /.well-known/x402.json — there is no OpenAPI
    for this surface. V3 x402 routes exist in source only and return 503 behind a release gate.
  image: https://theloopbreaker.com/og-image.png
  humanURL: https://theloopbreaker.com/SKILL.md
  baseURL: https://theloopbreaker.com/api/x402
