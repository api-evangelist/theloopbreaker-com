openapi: 3.2.0
info:
  title: Theloopbreaker Com Bridge API
  version: 3.4.0
  contact:
    url: https://theloopbreaker.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  description: 'Operations tagged Bridge across 2 of this provider''s published API definitions: theloopbreaker-com-openapi.json, theloopbreaker-com-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://theloopbreaker.com/api
  description: Production
tags:
- name: Bridge
  description: Cross-chain trust sync
paths:
  /agent/bridge:
    get:
      operationId: getBridgeState
      summary: Cross-chain bridge state from VaultfireTeleporterBridge
      tags:
      - Bridge
      parameters:
      - name: chain
        in: query
        required: true
        schema:
          type: string
          enum:
          - base
          - avalanche
          - arbitrum
          - polygon
      - name: address
        in: query
        required: false
        schema:
          type: string
        description: Optional agent address for recognition check
      responses:
        '200':
          description: Bridge stats and synced data counts
    servers:
    - url: https://theloopbreaker.com/api
      description: Production
x-refined-from:
- theloopbreaker-com-openapi.json
- theloopbreaker-com-openapi.yml
