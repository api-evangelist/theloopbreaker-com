openapi: 3.2.0
info:
  title: Theloopbreaker Com Insurance API
  version: 3.4.0
  contact:
    url: https://theloopbreaker.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  description: 'Operations tagged Insurance across 2 of this provider''s published API definitions: theloopbreaker-com-openapi.json, theloopbreaker-com-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://theloopbreaker.com/api
  description: Production
tags:
- name: Insurance
  description: Bond insurance pool
paths:
  /agent/insurance:
    get:
      operationId: getInsurance
      summary: Get bond insurance pool stats and agent coverage
      description: Query the VaultfireBondInsurancePool for pool stats and per-agent coverage.
      tags:
      - Insurance
      parameters:
      - name: chain
        in: query
        schema:
          type: string
          default: base
        description: Chain to query
      - name: address
        in: query
        schema:
          type: string
        description: Optional agent address for coverage lookup
      responses:
        '200':
          description: Pool stats and coverage info
    servers:
    - url: https://theloopbreaker.com/api
      description: Production
x-refined-from:
- theloopbreaker-com-openapi.json
- theloopbreaker-com-openapi.yml
